# this_file: _github/workflows/ci.yml

name: CI

on:
  push:
    branches: ["ogra/*"]
  pull_request:
    branches: ["ogra/*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # FFmpeg installation for Windows
          choco install ffmpeg -y

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Compile C library
        run: |
          python scripts/compile_c.py --verbose

      - name: Verify compiled library exists
        run: |
          python -c "import platform, pathlib, sys; s=platform.system(); a=platform.machine().lower(); n=('_stretch_arm64.dylib' if s=='Darwin' and a in ('arm64', 'aarch64') else '_stretch_x64.dylib' if s=='Darwin' else '_stretch_aarch64.so' if s=='Linux' and a in ('arm64', 'aarch64') else '_stretch_x64.so' if s=='Linux' else '_stretch_x64.dll' if s=='Windows' and a in ('amd64', 'x86_64') else '_stretch.dll'); p=pathlib.Path('src/audiostretchy/c_interface/lib')/n; print('expect:', p); sys.exit(0 if p.exists() else 1)"

      - name: Lint with flake8
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest tests/ -v --cov=src/audiostretchy --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Compile C library
        run: |
          python scripts/compile_c.py --verbose

      - name: Verify compiled library exists
        run: |
          python -c "import platform, pathlib, sys; s=platform.system(); a=platform.machine().lower(); n=('_stretch_arm64.dylib' if s=='Darwin' and a in ('arm64', 'aarch64') else '_stretch_x64.dylib' if s=='Darwin' else '_stretch_aarch64.so' if s=='Linux' and a in ('arm64', 'aarch64') else '_stretch_x64.so' if s=='Linux' else '_stretch_x64.dll' if s=='Windows' and a in ('amd64', 'x86_64') else '_stretch.dll'); p=pathlib.Path('src/audiostretchy/c_interface/lib')/n; print('expect:', p); sys.exit(0 if p.exists() else 1)"

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/
