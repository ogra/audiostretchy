# this_file: _github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install ffmpeg -y

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Compile C library
        run: |
          python scripts/compile_c.py --verbose

      - name: Verify compiled library exists
        run: |
          python -c "import platform, pathlib, sys; s=platform.system(); a=platform.machine().lower(); n=('_stretch_arm64.dylib' if s=='Darwin' and a in ('arm64', 'aarch64') else '_stretch_x64.dylib' if s=='Darwin' else '_stretch_aarch64.so' if s=='Linux' and a in ('arm64', 'aarch64') else '_stretch_x64.so' if s=='Linux' else '_stretch_x64.dll' if s=='Windows' and a in ('amd64', 'x86_64') else '_stretch.dll'); p=pathlib.Path('src/audiostretchy/c_interface/lib')/n; print('expect:', p); sys.exit(0 if p.exists() else 1)"

      - name: Test with pytest
        run: |
          pytest tests/ -v

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine

      - name: Compile C library
        run: |
          python scripts/compile_c.py --verbose

      - name: Verify compiled library exists
        run: |
          python -c "import platform, pathlib, sys; s=platform.system(); a=platform.machine().lower(); n=('_stretch_arm64.dylib' if s=='Darwin' and a in ('arm64', 'aarch64') else '_stretch_x64.dylib' if s=='Darwin' else '_stretch_aarch64.so' if s=='Linux' and a in ('arm64', 'aarch64') else '_stretch_x64.so' if s=='Linux' else '_stretch_x64.dll' if s=='Windows' and a in ('amd64', 'x86_64') else '_stretch.dll'); p=pathlib.Path('src/audiostretchy/c_interface/lib')/n; print('expect:', p); sys.exit(0 if p.exists() else 1)"

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/audiostretchy-f32/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Combine artifacts
        run: |
          mkdir -p dist/
          cp dist-*/* dist/ || true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/audiostretchy-f32/

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Combine artifacts
        run: |
          mkdir -p dist/
          cp dist-*/* dist/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
