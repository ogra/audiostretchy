[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "fire>=0.5.0",
    "numpy>=2.4.5",
]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "audiostretchy-f32"
dynamic = ["version"]
description = "AudioStretchy float32 is a Python library and CLI tool for high-quality time-stretching of audio files without changing pitch. Uses David Bryant's audio-stretch C library with Pedalboard for versatile audio I/O."
readme = "README.md"
authors = [{name = "Adam Twardoch", email = "adam+github@twardoch.com"}]
license = "BSD-3-Clause"
license-files = [
    "LICENSE.txt",
    "AUTHORS.md",
    "vendors/stretch/license.txt",
    "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fire>=0.5.0",
    "numpy>=2.4.5",
    "pedalboard>=0.9.23",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "black>=26.5.0", 
    "ruff>=0.15.13",
    "build>=1.5.0",
]
test = [
    "flake8>=7.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "soundfile>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/ogra/audiostretchy"
Repository = "https://github.com/ogra/audiostretchy.git"
Issues = "https://github.com/ogra/audiostretchy/issues"

[project.scripts]
audiostretchy-f32 = "audiostretchy.__main__:main"

# Hatch configuration
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/audiostretchy"]
artifacts = [
    "src/audiostretchy/c_interface/lib/*.so", 
    "src/audiostretchy/c_interface/lib/*.dylib", 
    "src/audiostretchy/c_interface/lib/*.dll",
    ]
include = [
    "src/audiostretchy/**/*.py",
    "src/audiostretchy/**/*.so",
    "src/audiostretchy/**/*.dylib", 
    "src/audiostretchy/**/*.dll",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/vendors",
    "/scripts",
    "pyproject.toml",
    "README.md",
    "LICENSE.txt",
    "AUTHORS.md",
]

# Development environment
[tool.hatch.envs.default]
dependencies = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "black>=26.5.0",
    "ruff>=0.15.13",
    "build>=1.5.0",
]

[tool.hatch.envs.test]
dependencies = [
    "pytest>=9.0.3", 
    "pytest-cov>=7.1.0",
    "soundfile>=0.12.0",
]

# Testing configuration
[tool.pytest.ini_options]
addopts = "--cov=src/audiostretchy --cov-report=term-missing --verbose"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "performance: performance benchmark tests",
]

# Linting and formatting
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["E203", "W503", "S101", "PLR0913", "PLR0912", "PLR0915", "C901"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]
